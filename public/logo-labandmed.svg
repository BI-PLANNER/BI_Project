<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Master Teal-Cyan Gradient -->
    <linearGradient id="labTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Deep Blue Contrast Gradient -->
    <linearGradient id="labNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Liquid Wave Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9" />
    </linearGradient>

    <!-- Emerald Glow for DNA Helix -->
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Group with Glow -->
  <g filter="url(#glow)">
    <!-- 1. Left Medical Cross -->
    <path d="M 125 210 H 90 V 245 H 125 V 280 H 160 V 245 H 195 V 210 H 160 V 175 H 125 Z" 
          fill="url(#labNavy)" 
          stroke="url(#labTeal)" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- 2. Main Beaker Outline & Body (Matraz) -->
    <path d="M 215 130 
             L 215 190 
             C 215 200, 185 240, 145 320 
             C 120 370, 150 420, 210 420 
             L 290 420 
             C 350 420, 380 370, 355 320 
             C 315 240, 285 200, 285 190 
             L 285 130 
             Z" 
          fill="url(#labNavy)" 
          stroke="url(#labTeal)" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Beaker Lip / Rim -->
    <rect x="200" y="115" width="100" height="18" rx="9" fill="url(#labTeal)" />

    <!-- 3. Internal Liquid Waves (Contenido Químico) -->
    <path d="M 160 330 
             Q 210 290, 250 330 
             T 340 330 
             L 345 365 
             C 335 405, 305 410, 250 410 
             C 195 410, 165 405, 155 365 
             Z" 
          fill="url(#liquidGrad)" />

    <!-- Secondary Wave highlight -->
    <path d="M 175 350 
             Q 220 320, 250 350 
             T 325 350 
             L 328 375 
             C 318 400, 290 405, 250 405 
             C 210 405, 182 400, 172 375 
             Z" 
          fill="url(#labTeal)" 
          opacity="0.6" />

    <!-- 4. Bubbles (Efervescencia) -->
    <circle cx="230" cy="270" r="10" fill="#ffffff" opacity="0.8" />
    <circle cx="270" cy="240" r="7" fill="#38bdf8" opacity="0.9" />
    <circle cx="250" cy="180" r="12" fill="#22d3ee" opacity="0.9" />
    <circle cx="240" cy="145" r="8" fill="#ffffff" opacity="0.85" />
    <circle cx="260" cy="100" r="6" fill="#38bdf8" opacity="0.75" />
    <circle cx="248" cy="70" r="9" fill="#22d3ee" opacity="0.9" />

    <!-- 5. Right DNA Helix (Estructura Genética) -->
    <!-- Helix Strand 1 (Outer Curve) -->
    <path d="M 310 190 
             C 380 230, 390 280, 340 330 
             C 300 370, 320 420, 380 435 
             C 410 440, 420 410, 400 380
             C 370 335, 410 260, 360 210
             Z" 
          fill="url(#dnaGrad)" />

    <!-- Helix Rungs (Peldaños de enlace de ADN) -->
    <line x1="330" y1="230" x2="365" y2="245" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="345" y1="265" x2="380" y2="275" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="345" y1="300" x2="375" y2="305" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="330" y1="335" x2="360" y2="335" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="325" y1="370" x2="360" y2="380" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="340" y1="405" x2="375" y2="415" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />

    <!-- Outer Swirl Base Accent -->
    <path d="M 180 425 
             C 210 450, 290 450, 320 425 
             C 300 440, 200 440, 180 425 Z" 
          fill="url(#labTeal)" />
  </g>
</svg>
